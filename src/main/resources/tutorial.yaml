startRoom: room-one # must match one of the keys in rooms:
description: |
  Welcome to the tutorial! This is a simple text adventure (also called 'interactive fiction').
  You can: Explore different locations, pick up items (into your 'inventory') and interact with objects and the environment to solve puzzles.
  You interact with your environment by entering simple sentences, starting with a verb.
  For a list of possible verbs, enter 'help verbs'.
  Often it is useful to examine objects: 'examine table'.
  Some objects are portable, to pick up a book, enter 'take book'
  Start with exploring your environment by visiting the other room. To do so, enter 'go east'.
rooms: # Map<String, Room>
  room-one: # they key of the room, or the internal name how it is referenced
    name: Starting room
    description: | # the pipe indicates a multiline string, see https://yaml-multiline.info/
      You are in an unadorned, rectangular room without windows and a table next to the wall.
      A simple light bulb is hanging from the ceiling, the only source of light, casting harsh shadows.
      There is a passage to the east, apparently to another room much like this.
      A narrow doorway to the west leads into a clockmaker's workshop.
    verbs: # for example as: Map<String, Map<String, List<Action>>>
      go: # "go" is the verb
        east: # "east" is the object, what follows, is a list (with 1 item) of actions:
          - room: room-two # "room" indicates we will switch rooms, this must be a key in "rooms"
        west:
          - room: workshop
      look:
        "":
          - message: "A simple light bulb hangs above a wooden table. Scratches mark the tabletop. A passage leads east to another room; a narrow doorway west opens onto a workshop."
        table:
          - ifState: key
            message: "The tabletop is empty. You already have its small key in your pocket."
          # "message" will be printed, but has no effect otherwise (but might yield hints)
          - message: "This is a simple, wooden table. It has a small key lying on top."
        light:
          - message: "A simple light bulb. It reads: 60W."
        key:
          - ifState: key
            message: "The small key is safely in your pocket."
          - message: "A small key."
      take:
        table:
          - message: "Guess what: The table is too heavy to carry around."
        light:
          - message: "How many players of interactive fiction does it take to unscrew this light bulb? Apparently, more than one."
        key:
          # conditional: only taken if a state "key" is set, otherwise the next action in the list is evaluated
          # only run the first matching action of the list
          - ifState: key
            message: "You already have the key safely in your pocket."
          # else:
          - addState: key # add a new state "key" to the Set of states
            message: "You pack it into your pocket."
  room-two:
    name: Another room
    description: |
      You are in another unadorned, rectangular room.
      There is a passage to the west. In the opposite direction you see a large wardrobe.
    verbs:
      go:
        west:
          - room: room-one
        east:
          - ifState: coat
            room: secret
      look:
        "":
          - ifState: coat
            message: "You are wearing the black coat. The wardrobe is open and empty, revealing the passage east. Go west to the starting room or east through the wardrobe."
          - ifState: wardrobeOpen
            message: "The wardrobe door is open. A black coat hangs inside, stirring in a draught from somewhere behind it. The starting room is west."
          - message: "A white wardrobe stands against the east wall. Its door is closed, with a small brass keyhole beneath the handle. The starting room is west."
        wardrobe:
          - ifState: coat
            message: "The wardrobe is open and empty. You are wearing its coat. Cold air drifts through the secret passage to the east."
          - ifState: wardrobeOpen
            message: "A large, white wardrobe with an open door. There is a black coat inside."
          - message: "A large, white wardrobe. It looks like an IKEA model. It is closed."
        coat:
          - ifState: coat
            message: "You are wearing the black coat. It keeps you warm."
          - ifState: wardrobeOpen
            message: "A heavy black coat hangs in the open wardrobe. Its lining rustles in a cold draught."
          - message: "The closed wardrobe hides whatever is inside."
      open:
        wardrobe:
          - ifState: wardrobeOpen
            message: "The wardrobe is already open."
          - ifState: key
            message: "The wardrobe is now unlocked."
            addState: wardrobeOpen
          - message: "The handle turns, but the wardrobe is locked. Its brass keyhole is small and ordinary."
      take:
        coat:
          - ifState: coat
            message: "You are already wearing the coat. The secret passage is east."
          - ifState: wardrobeOpen
            message: "It suits you well. But more importantly: you detect a secret passage through the wardrobe towards the east."
            addState: coat
  secret:
    name: A hidden room
    description: |
      You found the hidden passage to Narnia. Congratulations! The original tutorial is complete.
      But beyond the wardrobe, snow falls beneath a motionless sky. A distant bell has stopped mid-chime.
      A trail leads north into a frozen wood; the wardrobe back to the other room is west.
    verbs:
      go:
        west:
          - room: room-two
        north:
          - ifState: lantern
            room: frozen-wood
          - message: "The trees swallow the light. Beyond the first few steps, you cannot see the trail."
      look:
        "":
          - ifState: spring
            message: "Warm air enters through the wardrobe as the valley begins to thaw. The bell rings in the distance. Go north to the wood or west to the wardrobe room."
          - message: "Beyond the wardrobe, snow hangs in a motionless sky. A bell's unfinished note trembles in the air. A dark trail runs north into the wood; the wardrobe is west."
        snow:
          - ifState: spring
            message: "The snow is melting. The bell has restarted time."
          - message: "Every snowflake hangs still. Something has stopped time beyond the wood."
  workshop:
    name: Clockmaker's workshop
    description: |
      Silent clocks cover the walls. A brass lantern rests on a workbench.
      A dark staircase climbs up to an observatory. The starting room is east.
    verbs:
      go:
        east:
          - room: room-one
        up:
          - ifState: lantern
            room: observatory
          - message: "The staircase is too dark. You need a light before climbing."
      look:
        "":
          - ifState: lantern
            message: "Silent clocks line the workshop. You are carrying the lit lantern; its place on the bench is empty. Go up to the observatory or east to the starting room."
          - message: "Silent clocks line the workshop. A brass lantern rests on the bench beneath a dark staircase to the observatory. The starting room is east."
        bench:
          - ifState: lantern
            message: "The lantern's place on the bench is empty. You are carrying it."
          - message: "Among scattered gears sits a brass lantern, ready to be lit."
        lantern:
          - ifState: lantern
            message: "The lantern casts a warm circle of light around you."
          - message: "A brass lantern with a full oil reservoir and a built-in striker."
      take:
        lantern:
          - ifState: lantern
            message: "You are already carrying the lantern."
          - addState: lantern
            message: "You light the lantern and lift it from the workbench."
  observatory:
    name: Rooftop observatory
    description: |
      Moonlight shines through a cracked glass dome onto an old telescope.
      The staircase leads down to the workshop.
    verbs:
      go:
        down:
          - room: workshop
      look:
        telescope:
          - ifState: starMap
            message: "You check your sketch against the silver constellation: crown, fox, flame. The pattern is already recorded."
          - addState: starMap
            message: "Through the telescope you discover a silver constellation shaped like a key. You sketch its pattern: crown, fox, flame. Scratched into the brass rim are the words: What winter locks, the watcher remembers."
  frozen-wood:
    name: Frozen wood
    description: |
      Snow-laden trees lean over a stone milestone. A fox made of frost watches without blinking.
      The wardrobe clearing is south. An iron gate stands east; a ruined archive lies west.
    verbs:
      go:
        south:
          - room: secret
        east:
          - room: iron-gate
        west:
          - room: archive
      look:
        "":
          - ifState: spring
            message: "The wood begins to thaw. Snow slips from the branches and the fox moves again. Go south to the wardrobe, east to the open winter gate, or west to the archive."
          - message: "Snow-laden trees surround a weathered milestone and a frozen fox. The wardrobe clearing is south, an iron gate east, and a ruined archive west."
        milestone:
          - message: "The inscription reads: When the bell fell silent, the keeper hid its sun. Beneath it, a carved arrow points west toward the archive."
        fox:
          - ifState: spring
            message: "The fox is alive and shakes melting frost from its fur."
          - message: "Frozen eyes reflect three stars. It seems to be pointing toward the gate."
  iron-gate:
    name: Winter gate
    description: |
      An iron gate blocks the road north. Its lock is a dial covered with stars.
      An inscription says: The watcher above the workshop knows the order.
      The frozen wood lies west.
    verbs:
      go:
        west:
          - room: frozen-wood
        north:
          - ifState: winterGateOpen
            room: courtyard
          - message: "The gate is still locked. Three star-shaped recesses surround its dial."
      look:
        "":
          - ifState: spring
            message: "The iron gate stands open as its hinges thaw in the sunlight. Go north to the courtyard or west to the wood."
          - ifState: winterGateOpen
            message: "The iron gate stands open. Its star dial is unlocked; the road north to the courtyard is clear. Go north or return west to the wood."
          - ifState: starMap
            message: "The winter gate is closed. Its dial bears the same symbols as your sketch. Beyond the bars a courtyard lies north; the wood is west."
          - message: "An iron gate blocks the road north. A star-covered dial sits beneath an inscription: The watcher above the workshop knows the order. The wood is west."
        dial:
          - ifState: winterGateOpen
            message: "The dial is unlocked and the gate is already open. Go north to the courtyard."
          - ifState: starMap
            message: "Crown, fox, flame: the symbols match your sketch. The dial gives slightly beneath your fingers."
          - message: "Tiny stars surround three movable rings. The inscription calls them the watcher's memory."
      open:
        gate:
          - ifState: winterGateOpen
            message: "The gate is already open."
          - ifState: starMap
            addState: winterGateOpen
            message: "You set crown, fox, flame. The gate swings open. The road north is clear."
          - message: "The rings turn, then snap back. You have not found their order. The inscription mentions a watcher above the workshop."
  archive:
    name: Ruined archive
    description: |
      Frost curls across empty shelves. A keeper's journal lies open on a reading desk.
      A sealed brass chest rests beside it. The frozen wood is east.
    verbs:
      go:
        east:
          - room: frozen-wood
      look:
        "":
          - ifState: spring
            message: "The archive windows begin to thaw. The journal lies beside the open, empty chest; its sun gear is installed in the tower. Go east to the wood."
          - ifState: sunGear
            message: "The brass chest is empty. You have removed its sun gear. The keeper's journal remains on the desk. The wood lies east."
          - ifState: chestOpen
            message: "The brass chest is open. A golden gear rests in a velvet-lined hollow. The wood lies east."
          - message: "A brass chest stands beside the keeper's journal. A sun-shaped seal holds its lid shut. The wood lies east."
        journal:
          - ifState: spring
            message: "The keeper's instructions have been fulfilled. The sun gear and crank are installed, and the bell is ringing again."
          - ifState: gearInstalled
            message: "The journal's drawing matches the gear you installed. A faded margin note reads: A bell needs breath as well as teeth."
          - ifState: sunGear
            message: "The loose gear matches the journal's drawing of the bell tower movement. There are oily fingerprints beside a sketch of a winding handle."
          - addState: keeperSecret
            message: "The keeper wrote: My sun sleeps where winter cannot touch it. The seal remembers warmth. Beneath the words is a drawing of the bell tower movement: a toothed sun, a coiled spring, and a square winding socket. The last page is torn away."
        chest:
          - ifState: sunGear
            message: "The chest is open and empty. You have already removed its sun gear."
          - ifState: chestOpen
            message: "A golden sun gear rests inside the open chest."
          - message: "The sun seal has no keyhole. Its brass petals feel warmer where your lantern passes close. Faded handwriting resembles the keeper's journal."
      open:
        chest:
          - ifState: sunGear
            message: "The chest is already open and empty. You have removed its gear."
          - ifState: chestOpen
            message: "The chest stands open, with a golden gear inside."
          - ifState: keeperSecret
            addState: chestOpen
            message: "Following the journal, you hold the lantern against the sun seal. The chest opens, revealing a golden gear."
          - message: "The seal resists you. There is no keyhole, only faded handwriting around a brass sun."
      take:
        gear:
          - ifState: gearInstalled
            message: "The sun gear is already installed in the bell tower, not in this chest."
          - ifState: sunGear
            message: "You already have the sun gear."
          - ifState: chestOpen
            addState: sunGear
            message: "You wrap the sun gear in your coat. It is warm despite the frozen air."
          - message: "The sealed chest keeps its contents out of reach."
  courtyard:
    name: Silent courtyard
    description: |
      A dry fountain stands below a bell tower. A chain disappears into the fountain's well.
      Stone steps lead up to the tower mechanism. The winter gate is south.
      An iron chain hangs within reach over the well's edge.
    verbs:
      go:
        south:
          - room: iron-gate
        up:
          - room: bell-tower
      look:
        "":
          - ifState: spring
            message: "The courtyard begins to thaw and water runs through the fountain. The repaired bell tower is up; the open gate is south."
          - ifState: crank
            message: "You have recovered the fountain's winding crank. Its wet chain hangs slack. Stone steps lead up to the bell tower; the open gate is south."
          - ifState: gearInstalled
            message: "A metallic click echoes down from the tower. The fountain chain hangs loose now, something brass glinting at its far end. Steps lead up; the gate is south."
          - message: "A dry fountain stands beneath the bell tower. A chain descends into its well beside a rigid counterweight cable running up the tower wall. Stone steps lead up; the gate is south."
        fountain:
          - ifState: spring
            message: "Water flows again. You already recovered the crank and repaired the tower."
          - ifState: crank
            message: "You have already recovered the winding crank. Only the wet chain remains in the well."
          - ifState: gearInstalled
            message: "The counterweight has shifted. The chain is free now; a square-ended brass handle hangs from it just below the waterline."
          - message: "A square-ended brass handle hangs from a chain caught behind the counterweight. Its cable runs into the tower above. There are no gears or sockets in the fountain itself."
      use:
        gear:
          - ifState: gearInstalled
            message: "The gear is already installed upstairs."
          - message: "There is no place for a gear in the fountain. Only the counterweight cable connects it to the tower above."
      pull:
        chain:
          - ifState: crank
            message: "You already recovered the winding crank."
          - ifState: gearInstalled
            addState: crank
            message: "You pull the chain hand over hand and recover the winding crank. Its square end is polished by years of use."
          - message: "The chain is jammed behind the counterweight. The taut cable shudders against the tower wall."
  bell-tower:
    name: Bell tower mechanism
    description: |
      A pendulum hangs motionless above a machine with a sun-shaped gap and an empty crank socket.
      A balcony overlooks a valley trapped in winter. The courtyard is down.
      A bell rope hangs beside the machine.
    verbs:
      go:
        down:
          - room: courtyard
        east:
          - ifState: spring
            room: sunrise
          - message: "A wall of frozen mist blocks the eastern bridge. Restore the bell before crossing."
      look:
        "":
          - ifState: spring
            message: "Time is moving again. The pendulum swings and the valley begins to thaw. The repaired mechanism is running. Go east across the sunrise bridge, or down to the courtyard."
          - ifState: mechanismReady
            message: "The sun gear is installed and the spring is wound. A faint vibration reaches the bell rope beside you. The courtyard is down."
          - ifState: crank
            message: "The sun gear is installed. Beside it, an empty square socket matches the crank you recovered. The bell rope hangs slack. The courtyard is down."
          - ifState: gearInstalled
            message: "The sun gear is installed, but the crank socket is empty. The counterweight cable has slackened; it descends toward the fountain below. The courtyard is down."
          - ifState: sunGear
            message: "You are carrying the sun gear. Its teeth match the gap in the tower movement. A bell rope hangs beside the machine. The courtyard is down."
          - message: "A pendulum hangs motionless above a machine with a sun-shaped gap and a square socket. A bell rope hangs nearby. The courtyard is down; frozen mist hides the eastern bridge."
        mechanism:
          - ifState: spring
            message: "The repaired mechanism is running. Time is moving again. Go east to the sunrise."
          - ifState: mechanismReady
            message: "The gear is fitted and the spring is wound. The bell hammer is poised above its catch."
          - ifState: crank
            message: "The socket is square, like the end of your recovered crank. The gear is fitted, but the spring hangs slack."
          - ifState: gearInstalled
            message: "The gear is meshed with its neighbours. An empty square socket sits beside the slack spring; the counterweight cable now moves freely toward the fountain below."
          - ifState: sunGear
            message: "The sun gear in your coat matches the empty space between the remaining teeth."
          - message: "A sun-shaped gear is missing from the movement. The keeper's initials are scratched beside the gap."
      use:
        gear:
          - ifState: gearInstalled
            message: "The sun gear is already fitted."
          - ifState: sunGear
            addState: gearInstalled
            message: "You fit the sun gear. The teeth engage, and a heavy clunk sounds from the fountain's counterweight below. The winding socket remains empty."
          - message: "You have no gear that fits the sun-shaped gap."
        crank:
          - ifState: spring
            message: "The mechanism is already running. You do not need to wind it again."
          - ifState: mechanismReady
            message: "The crank is already attached and the spring is wound."
          - ifState: crank
            addState: mechanismReady
            message: "You attach the crank and wind the spring. The fitted sun gear begins to glow. The bell rope twitches as the hammer rises."
          - message: "You have no crank that fits the square socket."
      ring:
        bell:
          - ifState: spring
            message: "The bell rings freely. The eastern bridge leads to the sunrise."
          - ifState: mechanismReady
            addState: spring
            message: "The bell sounds across the valley. Snow begins to fall, then melts into rain. Time is moving again. A bridge appears east toward the sunrise."
          - ifState: gearInstalled
            message: "The gear is fitted, but the spring is slack. The bell hammer drops without reaching the bronze."
          - message: "The bell is silent. Its linkage ends at the gap where a gear should be."
  sunrise:
    name: Valley of the first sunrise
    description: |
      You step onto the bridge as the sun rises over a thawing valley. The fox below shakes frost from its fur.
      The keeper's bell answers a hundred distant bells. You returned the sun and broke the long winter.
      THE END - The Clockmaker's Winter. Congratulations!
      You may go west to explore again, view 'history', or 'quit'.
    verbs:
      go:
        west:
          - room: bell-tower
# global verbs: here we define defaults/synonyms and error-messages
globals:
  default:
    unknownVerb: You cannot do that.
    unknownObject: ""
  help:
    synonyms: [ wtf ]
    unknownVerb: |
        Most of the time, typing something like <verb object> works. Example: <open door>.
        You can go to a possible direction typing <go (direction)>.
        You can examine the room or any object typing <examine (object)>. Look around with <look>.
        Type <help verbs> to get a list of possible verbs.
    unknownObject: "Possible verbs include: go, take, look, examine, open, pull, use, ring. Commands use a verb and an object, such as 'open door' or 'use tool'. Movement uses directions, such as 'go north'. Enter 'look' to reread your surroundings."
  go:
    synonyms: [ walk, drive, climb, move ]
    unknownVerb: You can't go there! # if the room does not know the verb 'go' at all
    unknownObject: You can't go {} from here! # if the room does know 'go' but not the object
  take:
    synonyms: [ grab, get, pick ]
    unknownVerb: There's nothing to take!
    unknownObject: You can't take {}!
  look:
    synonyms: [ examine ]
    unknownVerb: Nothing to look at in here!
    unknownObject: You cannot look at {}!
  open:
    synonyms: [ unlock ]
    unknownVerb: Nothing to open here!
    unknownObject: You cannot open {}!
