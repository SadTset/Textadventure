startRoom: room-one # must match one of the keys in rooms:
description: |
  Welcome to the tutorial! This is a simple text adventure (also called 'interactive fiction').
  You can: Explore different locations, pick up items (into your 'inventory') and interact with objects and the environment to solve puzzles.
  You interact with your environment by entering simple sentences, starting with a verb.
  For a list of possible verbs, enter 'help verbs'.
  Often it is useful to examine objects: 'examine table'.
  Some objects are portable, to pick up a book, enter 'take book'
  Start with exploring your environment by visiting the other room. To do so, enter 'go east'.
rooms: # Map<String, Room>
  room-one: # they key of the room, or the internal name how it is referenced
    name: Starting room
    description: | # the pipe indicates a multiline string, see https://yaml-multiline.info/
      You are in an unadorned, rectangular room without windows and a table next to the wall.
      A simple light bulb is hanging from the ceiling, the only source of light, casting harsh shadows.
      There is a passage to the east, apparently to another room much like this.
      A narrow doorway to the west leads into a clockmaker's workshop.
    verbs: # for example as: Map<String, Map<String, List<Action>>>
      go: # "go" is the verb
        east: # "east" is the object, what follows, is a list (with 1 item) of actions:
          - room: room-two # "room" indicates we will switch rooms, this must be a key in "rooms"
        west:
          - room: workshop
      look:
        table:
          # "message" will be printed, but has no effect otherwise (but might yield hints)
          - message: "This is a simple, wooden table. It has a small key lying on top."
        light:
          - message: "A simple light bulb. It reads: 60W."
        key:
          - message: "A small key."
      take:
        table:
          - message: "Guess what: The table is too heavy to carry around."
        light:
          - message: "How many players of interactive fiction does it take to unscrew this light bulb? Apparently, more than one."
        key:
          # conditional: only taken if a state "key" is set, otherwise the next action in the list is evaluated
          # only run the first matching action of the list
          - ifState: key
            message: "You already have the key safely in your pocket."
          # else:
          - addState: key # add a new state "key" to the Set of states
            message: "You pack it into your pocket."
  room-two:
    name: Another room
    description: |
      You are in another unadorned, rectangular room.
      There is a passage to the west. In the opposite direction you see a large wardrobe.
    verbs:
      go:
        west:
          - room: room-one
        east:
          - ifState: coat
            room: secret
      look:
        wardrobe:
          - ifState: wardrobeOpen
            message: "A large, white wardrobe with an open door. There is a black coat inside."
          - message: "A large, white wardrobe. It looks like an IKEA model. It is closed."
        coat:
          - message: "A large, black coat. It might suit you."
      open:
        wardrobe:
          - ifState: key
            message: "The wardrobe is now unlocked."
            addState: wardrobeOpen
          - message: "You try to pick up the wardrobe... Well... no."
      take:
        coat:
          - ifState: wardrobeOpen
            message: "It suits you well. But more importantly: you detect a secret passage through the wardrobe towards the east."
            addState: coat
  secret:
    name: A hidden room
    description: |
      You found the hidden passage to Narnia. Congratulations! The original tutorial is complete.
      But beyond the wardrobe, snow falls beneath a motionless sky. A distant bell has stopped mid-chime.
      A trail leads north into a frozen wood; the wardrobe back to the other room is west.
    verbs:
      go:
        west:
          - room: room-two
        north:
          - ifState: lantern
            room: frozen-wood
          - message: "The trees swallow the light. Bring the lantern from the workshop before following the trail north."
      look:
        snow:
          - message: "Every snowflake hangs still. Something has stopped time beyond the wood."
  workshop:
    name: Clockmaker's workshop
    description: |
      Silent clocks cover the walls. A brass lantern rests on a workbench.
      A dark staircase climbs up to an observatory. The starting room is east.
    verbs:
      go:
        east:
          - room: room-one
        up:
          - ifState: lantern
            room: observatory
          - message: "The staircase is too dark. You need a light before climbing."
      look:
        bench:
          - message: "Among scattered gears sits a brass lantern, ready to be lit."
        lantern:
          - ifState: lantern
            message: "The lantern casts a warm circle of light around you."
          - message: "A brass lantern with a full oil reservoir and a built-in striker."
      take:
        lantern:
          - ifState: lantern
            message: "You are already carrying the lantern."
          - addState: lantern
            message: "You light the lantern and lift it from the workbench."
  observatory:
    name: Rooftop observatory
    description: |
      Moonlight shines through a cracked glass dome onto an old telescope.
      The staircase leads down to the workshop.
    verbs:
      go:
        down:
          - room: workshop
      look:
        telescope:
          - addState: starMap
            message: "Through the telescope you discover a silver constellation shaped like a key. You sketch its pattern: crown, fox, flame. A plate on the telescope reads: The winter gate remembers the stars. Beyond it, return the sun to the bell tower."
  frozen-wood:
    name: Frozen wood
    description: |
      Snow-laden trees lean over a stone milestone. A fox made of frost watches without blinking.
      The wardrobe clearing is south. An iron gate stands east; a ruined archive lies west.
    verbs:
      go:
        south:
          - room: secret
        east:
          - room: iron-gate
        west:
          - room: archive
      look:
        milestone:
          - message: "The inscription reads: When the bell fell silent, the keeper hid its sun. Seek his journal in the archive."
        fox:
          - message: "Frozen eyes reflect three stars. It seems to be pointing toward the gate."
  iron-gate:
    name: Winter gate
    description: |
      An iron gate blocks the road north. Its lock is a dial covered with stars.
      An inscription says: The watcher above the workshop knows the order.
      Return west to the frozen wood. To try the star dial, enter 'open gate'.
    verbs:
      go:
        west:
          - room: frozen-wood
        north:
          - ifState: winterGateOpen
            room: courtyard
          - message: "The gate is still locked. Examine the dial and try 'open gate'."
      look:
        dial:
          - ifState: starMap
            message: "Your sketch shows the order: crown, fox, flame. You can now open the gate."
          - message: "Too many stars to guess. Perhaps the telescope above the workshop reveals the pattern."
      open:
        gate:
          - ifState: winterGateOpen
            message: "The gate is already open."
          - ifState: starMap
            addState: winterGateOpen
            message: "You set crown, fox, flame. The gate swings open. The road north is clear."
          - message: "The dial will not move without the right pattern. Try the telescope above the workshop."
  archive:
    name: Ruined archive
    description: |
      Frost curls across empty shelves. A keeper's journal lies open on a reading desk.
      A sealed brass chest rests beside it. The frozen wood is east.
    verbs:
      go:
        east:
          - room: frozen-wood
      look:
        journal:
          - addState: keeperSecret
            message: "The keeper wrote: My chest opens to warmth, not iron. Hold a lit lantern beside the seal. Its sun gear belongs in the tower mechanism. The courtyard fountain hides the winding crank; pull its chain."
        chest:
          - message: "The seal is a small brass sun. There is no keyhole. Read the journal for the keeper's instructions."
      open:
        chest:
          - ifState: chestOpen
            message: "The chest stands open. Take the sun gear with 'take gear'."
          - ifState: keeperSecret
            addState: chestOpen
            message: "Following the journal, you hold the lantern against the sun seal. The chest opens, revealing a golden gear. Take it with 'take gear'."
          - message: "There is no keyhole. The journal on the desk might explain the seal."
      take:
        gear:
          - ifState: sunGear
            message: "You already have the sun gear."
          - ifState: chestOpen
            addState: sunGear
            message: "You wrap the sun gear in your coat. It is warm despite the frozen air."
          - message: "The sun gear is inside the sealed chest. Read the journal, then open the chest."
  courtyard:
    name: Silent courtyard
    description: |
      A dry fountain stands below a bell tower. A chain disappears into the fountain's well.
      Stone steps lead up to the tower mechanism. The winter gate is south.
      You can 'look fountain' or 'pull chain'.
    verbs:
      go:
        south:
          - room: iron-gate
        up:
          - room: bell-tower
      look:
        fountain:
          - message: "A winding crank hangs from a chain connected to the tower's counterweight. Fit the missing tower gear to release the chain, then 'pull chain'."
      pull:
        chain:
          - ifState: crank
            message: "You already recovered the winding crank."
          - ifState: gearInstalled
            addState: crank
            message: "You pull the chain hand over hand and recover the winding crank. Carry it up to the tower."
          - message: "The chain is jammed by the tower's frozen counterweight. Fit the sun gear in the tower first."
  bell-tower:
    name: Bell tower mechanism
    description: |
      A pendulum hangs motionless above a machine with a sun-shaped gap and an empty crank socket.
      A balcony overlooks a valley trapped in winter. The courtyard is down.
      Try 'look mechanism', 'use gear', 'use crank', and finally 'ring bell'.
    verbs:
      go:
        down:
          - room: courtyard
        east:
          - ifState: spring
            room: sunrise
          - message: "A wall of frozen mist blocks the eastern bridge. Restore the bell before crossing."
      look:
        mechanism:
          - ifState: mechanismReady
            message: "The gear is fitted and the spring is wound. Ring the bell to restart time."
          - ifState: gearInstalled
            message: "The sun gear fits perfectly. Use the crank from the courtyard fountain to wind the spring."
          - message: "The sun gear is missing. The keeper's journal in the archive explains where it is hidden."
      use:
        gear:
          - ifState: gearInstalled
            message: "The sun gear is already fitted."
          - ifState: sunGear
            addState: gearInstalled
            message: "You fit the sun gear. The teeth engage and release the fountain's counterweight below. Pull its chain to recover the crank, then bring it here and 'use crank'."
          - message: "You need the sun gear from the archive chest. Read the keeper's journal there."
        crank:
          - ifState: crank
            addState: mechanismReady
            message: "You attach the crank and wind the spring. The fitted sun gear begins to glow. Now 'ring bell'."
          - message: "You need the winding crank. Look in the courtyard fountain below."
      ring:
        bell:
          - ifState: spring
            message: "The bell rings freely. The eastern bridge leads to the sunrise."
          - ifState: mechanismReady
            addState: spring
            message: "The bell sounds across the valley. Snow begins to fall, then melts into rain. Time is moving again. A bridge appears east toward the sunrise."
          - ifState: gearInstalled
            message: "The gear is fitted, but the spring is slack. Recover the crank from the courtyard fountain and 'use crank'."
          - message: "The bell is silent. Find the sun gear in the archive and fit it with 'use gear'."
  sunrise:
    name: Valley of the first sunrise
    description: |
      You step onto the bridge as the sun rises over a thawing valley. The fox below shakes frost from its fur.
      The keeper's bell answers a hundred distant bells. You returned the sun and broke the long winter.
      THE END - The Clockmaker's Winter. Congratulations!
      You may go west to explore again, view 'history', or 'quit'.
    verbs:
      go:
        west:
          - room: bell-tower
# global verbs: here we define defaults/synonyms and error-messages
globals:
  default:
    unknownVerb: You cannot do that.
    unknownObject: ""
  help:
    synonyms: [ wtf ]
    unknownVerb: |
        Most of the time, typing something like <verb object> works. Example: <open door>.
        You can go to a possible direction typing <go (direction)>.
        You can examine the room or any object typing <examine (object)>. Look around with <look>.
        Type <help verbs> to get a list of possible verbs.
    unknownObject: "Possible verbs include: go, take, examine, open,..."
  go:
    synonyms: [ walk, drive, climb, move ]
    unknownVerb: You can't go there! # if the room does not know the verb 'go' at all
    unknownObject: You can't go {} from here! # if the room does know 'go' but not the object
  take:
    synonyms: [ grab, get, pick ]
    unknownVerb: There's nothing to take!
    unknownObject: You can't take {}!
  look:
    synonyms: [ examine ]
    unknownVerb: Nothing to look at in here!
    unknownObject: You cannot look at {}!
  open:
    synonyms: [ unlock ]
    unknownVerb: Nothing to open here!
    unknownObject: You cannot open {}!
